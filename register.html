<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký | Pokémon Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Logo -->
    <link rel="icon" type="image/png" href="./Image/logo.png">
    <!-- Tích hợp Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="./style/main.css">
    <link rel="stylesheet" href="./style/register-login.css">
</head>
<body class="body-register">
    <img src="./Image/logo.png" class="bg-pokeball">
    <div class="register-container">
        <div class="register-card">
            <!-- Logo -->
            <div class="text-center mb-3">
                <div class="logo-box">
                    <img src="./Image/logo.png" class="logo-register">
                    <h2 class="web-name">Pokémon Hub</h2>
                </div>
                <p class="text-muted mb-0">Bắt đầu với tài khoản mới</p>
            </div>
            <!-- Form -->
            <form id="registerForm" class="inner-card">
                <!-- Username -->
                <div class="mb-3">
                    <label for="username">Username</label>
                    <div class="input-group">
                        <input type="text" id="username" class="form-control" placeholder="Nhập username">
                    </div>
                    <small id="usernameError" class="field-error"></small>
                </div>
                <!-- Email -->
                <div class="mb-3">
                    <label for="email">Email</label>
                    <div class="input-group">
                        <input type="email" id="email" class="form-control" placeholder="Nhập email">
                    </div>
                    <small id="emailError" class="field-error"></small>
                </div>
                <!-- Password -->
                <div class="mb-3">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">
                    </div>
                    <small id="passwordError" class="field-error"></small>
                </div>
                <!-- Confirm Password -->
                <div class="mb-3">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu">
                    </div>
                    <small id="confirmPasswordError" class="field-error"></small>
                </div>
                <!-- Button -->
                <button type="submit" class="btn-register">
                    <i class="bi bi-person-plus-fill"></i>
                    <span>Đăng ký</span>
                </button>
            </form>
            <p class="login-link mt-3">Đã có tài khoản?
                <a href="./login.html">Đăng nhập ngay</a>
            </p>  
        </div>
    </div>
    <script type="module" src="./js/register.js"></script>
    <script>
        (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...args)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="v2Z13ueAslLe-hNsM6IUq";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
    </script>
</body>
</html>
